    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3a3"/><stop offset="0.5" stop-color="#e8b04a"/><stop offset="1" stop-color="#b47a22"/>

    <path d="M240 318 C290 306 340 310 372 326"/><path d="M240 352 C290 340 340 344 372 360"/><path d="M240 386 C290 374 340 378 372 394"/>
    <path d="M428 326 C460 310 510 306 560 318"/><path d="M428 360 C460 344 510 340 560 352"/><path d="M428 394 C460 378 510 374 560 386"/>

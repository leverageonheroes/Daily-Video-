name: Carousel (manual test / backup)

# The carousel normally runs on the Railway worker (tools/railway/). This workflow is for testing it by hand,
# or as a backup if Railway is down: Actions tab -> Carousel -> Run workflow.
on:
  # Catch-up run from a phone/agent: edit triggers/carousel-now and push -> render, upload, public now.
  push:
    paths: ["triggers/carousel-now"]
  workflow_dispatch:
    inputs:
      channels:
        description: "Channels (blank = all with carousel.json)"
        required: false
        default: ""
      upload:
        description: "Upload to YouTube (1) or render only (0)"
        required: false
        default: "0"
      publish_now:
        description: "Make public immediately (1) instead of the fixed publish_local slot (0)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: carousel
  cancel-in-progress: false

jobs:
  carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Render (and upload)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
          CLOUDFLARE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT }}
          CLOUDFLARE_ID: ${{ secrets.CLOUDFLARE_ID }}
          CF_ID: ${{ secrets.CF_ID }}
          CLOUDFLARE_ACC_ID: ${{ secrets.CLOUDFLARE_ACC_ID }}
          CF_ACC_ID: ${{ secrets.CF_ACC_ID }}
          CLOUDFLARE_ACCOUNTID: ${{ secrets.CLOUDFLARE_ACCOUNTID }}
          CF_ACCOUNTID: ${{ secrets.CF_ACCOUNTID }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
          CF_API: ${{ secrets.CF_API }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CLOUDFLARE_KEY: ${{ secrets.CLOUDFLARE_KEY }}
          CF_KEY: ${{ secrets.CF_KEY }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          YT_TOKEN_ELDERS: ${{ secrets.YT_TOKEN_ELDERS }}
          YT_TOKEN_CRIBCOMMITTEE: ${{ secrets.YT_TOKEN_CRIBCOMMITTEE }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_TOKEN_FACEBOOK_INSTAGRAM: ${{ secrets.META_TOKEN_FACEBOOK_INSTAGRAM }}
          FACEBOOK_INSTAGRAM_PAGE_IDS: ${{ secrets.FACEBOOK_INSTAGRAM_PAGE_IDS }}
          FACEBOOK_INSTAGRAM_PAGE_IDS_CRIB: ${{ secrets.FACEBOOK_INSTAGRAM_PAGE_IDS_CRIB }}
          FACEBOOK_INSTAGRAM_PAGE_IDS_ELDERS: ${{ secrets.FACEBOOK_INSTAGRAM_PAGE_IDS_ELDERS }}
          FB_ID_ELDERS: ${{ vars.FB_ID_ELDERS || secrets.FB_ID_ELDERS }}
          IG_ID_ELDERS: ${{ vars.IG_ID_ELDERS || secrets.IG_ID_ELDERS }}
          ELDERS_FB_ID: ${{ vars.ELDERS_FB_ID || secrets.ELDERS_FB_ID }}
          ELDERS_IG_ID: ${{ vars.ELDERS_IG_ID || secrets.ELDERS_IG_ID }}
          CRIBCOMMITTEE_FB_ID: ${{ vars.CRIBCOMMITTEE_FB_ID || secrets.CRIBCOMMITTEE_FB_ID }}
          CRIBCOMMITTEE_IG_ID: ${{ vars.CRIBCOMMITTEE_IG_ID || secrets.CRIBCOMMITTEE_IG_ID }}
          YT_UPLOAD: ${{ github.event_name == 'push' && '1' || inputs.upload }}
          YT_PUBLISH_NOW: ${{ github.event_name == 'push' && '1' || inputs.publish_now }}
        run: |
          for v in CF_ACCOUNT_ID CLOUDFLARE_ACCOUNT_ID CF_ACCOUNT CLOUDFLARE_ACCOUNT CLOUDFLARE_ID CF_ID CLOUDFLARE_ACC_ID CF_ACC_ID CLOUDFLARE_ACCOUNTID CF_ACCOUNTID ACCOUNT_ID CF_API_TOKEN CLOUDFLARE_API_TOKEN CF_API_KEY CLOUDFLARE_API_KEY CLOUDFLARE_API CF_API CLOUDFLARE_TOKEN CF_TOKEN CLOUDFLARE_KEY CF_KEY; do [ -n "${!v:-}" ] && echo "secret $v: set"; done
          echo "secret names: $(echo "$ALL_SECRETS" | python -c 'import json,sys;print(" ".join(sorted(json.load(sys.stdin))))')"
          echo "variable names: $(echo "$ALL_VARS" | python -c 'import json,sys;print(" ".join(sorted(json.load(sys.stdin))))')"
          python -m pipeline.run carousel ${{ inputs.channels }}
      - name: Save progress
        if: always() && (github.event_name == 'push' || inputs.upload == '1')
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/carousel.json
          if ! git diff --cached --quiet; then git commit -m "carousel: $(date -u +%F)"; git pull --rebase; git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel-${{ github.run_id }}
          path: output/carousel/**/final.mp4
          retention-days: 7
          if-no-files-found: ignore

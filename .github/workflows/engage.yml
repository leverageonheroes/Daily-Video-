name: Engage

# Growth on autopilot (pipeline/engage.py), no uploads:
#  - every 3 hours: a question comment on newly public videos + adds them to theme playlists (max 20 actions
#    = 1,000 quota units a day across all channels; needs the comments/playlists login, see SETUP.md section 14)
#  - Sundays: "what's working" report -> reports/insights.md; carousels and extras then favour the best themes.
on:
  schedule:
    - cron: "20 */3 * * *"
    - cron: "50 8 * * 0"
  workflow_dispatch:
    inputs:
      task:
        description: "engage or insights"
        required: false
        default: "engage"

permissions:
  contents: write

concurrency:
  group: engage
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          YT_TOKEN_FLAT4B: ${{ secrets.YT_TOKEN_FLAT4B }}
          YT_TOKEN_COLDHEARTS: ${{ secrets.YT_TOKEN_COLDHEARTS }}
          YT_TOKEN_DRIZZLEPUDGE: ${{ secrets.YT_TOKEN_DRIZZLEPUDGE }}
          YT_TOKEN_ELDERS: ${{ secrets.YT_TOKEN_ELDERS }}
          YT_TOKEN_CRIBCOMMITTEE: ${{ secrets.YT_TOKEN_CRIBCOMMITTEE || secrets.YT_TOKEN_CRIB }}
        run: |
          TASK="${{ inputs.task }}"
          if [ -z "$TASK" ]; then TASK=engage; [ "${{ github.event.schedule }}" = "50 8 * * 0" ] && TASK=insights; fi
          python -m pipeline.run $TASK
      - name: Save progress
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/engage.json state/insights.json reports/insights.md 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "engage: $(date -u +%F)"; git pull --rebase; git push; fi

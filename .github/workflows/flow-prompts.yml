name: Flow prompts (Google Flow channels)

# Every morning: post each Flow channel's next 5 Google Flow prompts as its own GitHub issue (label flow-<channel>).
on:
  schedule:
    - cron: "41 5 * * *"      # 05:41 UTC, well before the free-tier pause (~14:00-17:00 UTC)
    - cron: "17 8 * * *"      # backup: GitHub often delays/drops scheduled runs; the open-issue check prevents duplicates
  workflow_dispatch:
  push:                       # re-run on demand: edit triggers/flow-prompts and push
    branches: [main]      # tag pushes (Release creation) ignore paths filters - never run on those
    paths: ["triggers/flow-prompts"]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  prompts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Write prompts
        env:
          GH_TOKEN: ${{ github.token }}          # flow-film: start frames go to / are read from a release
          FAL_KEY: ${{ secrets.FAL_KEY }}        # flow-film start frames (~$0.02 each); paused channels never run
        run: python -m pipeline.run flow-prompts
      - name: Post as issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create flow-clips --color 8B5CF6 --description "Daily Google Flow prompts" 2>/dev/null || true
          for ch in $(python -c "from pipeline import flow; print(' '.join(flow.flow_channels()))"); do
            f="inbox/$ch/PROMPTS.md"
            [ -f "$f" ] || continue
            label="flow-$ch"
            gh label create "$label" --color 8B5CF6 --description "Daily Google Flow prompts: $ch" 2>/dev/null || true
            title="Flow clips $(date -u +%a\ %d\ %b): $(head -1 "$f" | sed 's/^## //' | cut -c1-80)"
            id=$(head -1 "$f" | grep -o '[A-Z]\+-[0-9]\{3\}' | head -1)
            prefix="${id%-*}"
            # this channel's open issues: its own label, or the old shared flow-clips label with its id prefix
            open_issues() {
              { gh issue list --state open --label "$label" --json number,title -q '.[] | "\(.number)\t\(.title)"'
                if [ -n "$prefix" ]; then gh issue list --state open --label flow-clips --json number,title \
                  -q ".[] | select(.title | contains(\"$prefix-\")) | \"\(.number)\t\(.title)\""; fi
              } | sort -u
            }
            open_n=$(open_issues | grep -F "$id" | cut -f1 | head -1 || true)
            if [ -n "$id" ] && [ -n "$open_n" ]; then
              # Same episode still waiting for clips (episodes never skip): remind instead of re-posting.
              if ! gh issue view "$open_n" --json comments -q '.comments[].body' | grep -qF "$(date -u +%F)"; then
                gh issue comment "$open_n" --body "Reminder $(date -u +%F): $id is still waiting for its clips - the prompts above are still today's prompts."
              fi
              echo "Issue #$open_n for $id already open - reminder posted"; continue
            fi
            for n in $(open_issues | cut -f1); do
              gh issue close "$n" --comment "Superseded by today's prompts." || true
            done
            gh issue create --title "$title" --label flow-clips --label "$label" --body-file "$f"
          done
      - name: Save prompts file
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add inbox state
          if ! git diff --cached --quiet; then
            git commit -m "flow: prompts $(date -u +%F)"
            git pull --rebase -X theirs
            git push
          fi

name: Weekly compilation

# Every Sunday: for each channel whose new episodes add up to 8.5+ minutes (so mid-roll ads are allowed),
# stitch them into one long 16:9 video with chapters and upload it. Channels below that wait for next week.
on:
  schedule:
    - cron: "47 7 * * 0"
  workflow_dispatch:
    inputs:
      channel:
        description: "Only this channel (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-shorts        # never runs at the same time as the daily job
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Compile and upload
        env:
          YT_TOKEN_FLAT4B: ${{ secrets.YT_TOKEN_FLAT4B }}
          YT_TOKEN_COLDHEARTS: ${{ secrets.YT_TOKEN_COLDHEARTS }}
          YT_TOKEN_DRIZZLEPUDGE: ${{ secrets.YT_TOKEN_DRIZZLEPUDGE }}
          REVIEW_HOURS: ${{ vars.REVIEW_HOURS || '10' }}
          CHANNELS: ${{ vars.CHANNELS || 'flat4b,coldhearts,drizzlepudge' }}
          YT_UPLOAD: ${{ vars.YT_UPLOAD || '1' }}
          STORE_RELEASES: "1"
          WEEKLY_MIN_SECONDS: ${{ vars.WEEKLY_MIN_SECONDS || '510' }}
          GH_TOKEN: ${{ github.token }}
        run: python -m pipeline.run weekly ${{ inputs.channel }}

      - name: Save progress
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "weekly: compilation $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - name: Keep the compilation for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-${{ github.run_id }}
          path: output/**/compilations/**/*.mp4
          retention-days: 7
          if-no-files-found: ignore

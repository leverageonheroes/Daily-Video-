name: Extras

# Short daily extra formats (pipeline/extras.py): Finish the Elder's Sentence, Then vs Now, What Babies Really Mean.
# Lowest priority for the shared YouTube quota: runs in the last hours of the Pacific quota day (two cron lines
# cover summer and winter time; the code ignores the one outside 22:00-24:00 Los Angeles) and stops cleanly on
# quotaExceeded. Manual test: Actions -> Extras -> Run workflow (upload 0 = render only, video kept 7 days).
on:
  schedule:
    - cron: "45 6 * * *"
    - cron: "45 7 * * *"
  push:
    branches: [main]
    paths: ["triggers/extras-now"]     # catch-up from a phone/agent: edit this file and push (ignores the time window)
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs, e.g. elders:finish cribcommittee:babymean (blank = all)"
        required: false
        default: ""
      upload:
        description: "Upload to YouTube (1) or render only (0)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: extras
  cancel-in-progress: false

jobs:
  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Render (and upload)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT || vars.CF_ACCOUNT }}
          CLOUDFLARE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT || vars.CLOUDFLARE_ACCOUNT }}
          CLOUDFLARE_ID: ${{ secrets.CLOUDFLARE_ID || vars.CLOUDFLARE_ID }}
          CF_ID: ${{ secrets.CF_ID || vars.CF_ID }}
          CLOUDFLARE_ACC_ID: ${{ secrets.CLOUDFLARE_ACC_ID || vars.CLOUDFLARE_ACC_ID }}
          CF_ACC_ID: ${{ secrets.CF_ACC_ID || vars.CF_ACC_ID }}
          CLOUDFLARE_ACCOUNTID: ${{ secrets.CLOUDFLARE_ACCOUNTID || vars.CLOUDFLARE_ACCOUNTID }}
          CF_ACCOUNTID: ${{ secrets.CF_ACCOUNTID || vars.CF_ACCOUNTID }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID || vars.ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ACCOUNT_: ${{ secrets.CLOUDFLARE_ACCOUNT_ACCOUNT_ || vars.CLOUDFLARE_ACCOUNT_ACCOUNT_ }}
          CLOUDFLARE_ACCOUNT_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ACCOUNT || vars.CLOUDFLARE_ACCOUNT_ACCOUNT }}
          CLOUDFLARE_CCOUNT_: ${{ secrets.CLOUDFLARE_CCOUNT_ || vars.CLOUDFLARE_CCOUNT_ }}
          CLOUDFLARE_CCOUNT: ${{ secrets.CLOUDFLARE_CCOUNT || vars.CLOUDFLARE_CCOUNT }}
          CLOUDFLARE_ACCOUNT_: ${{ secrets.CLOUDFLARE_ACCOUNT_ || vars.CLOUDFLARE_ACCOUNT_ }}
          CLOUDFLARE_CCOUNT_ID: ${{ secrets.CLOUDFLARE_CCOUNT_ID || vars.CLOUDFLARE_CCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_API: ${{ secrets.CLOUDFLARE_API }}
          CF_API: ${{ secrets.CF_API }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CLOUDFLARE_KEY: ${{ secrets.CLOUDFLARE_KEY }}
          CF_KEY: ${{ secrets.CF_KEY }}
          GH_TOKEN: ${{ github.token }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          YT_TOKEN_ELDERS: ${{ secrets.YT_TOKEN_ELDERS }}
          YT_TOKEN_CRIBCOMMITTEE: ${{ secrets.YT_TOKEN_CRIBCOMMITTEE || secrets.YT_TOKEN_CRIB }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_TOKEN_FACEBOOK_INSTAGRAM: ${{ secrets.META_TOKEN_FACEBOOK_INSTAGRAM }}
          FACEBOOK_INSTAGRAM_PAGE_IDS: ${{ secrets.FACEBOOK_INSTAGRAM_PAGE_IDS }}
          FACEBOOK_INSTAGRAM_PAGE_IDS_CRIB: ${{ secrets.FACEBOOK_INSTAGRAM_PAGE_IDS_CRIB }}
          FACEBOOK_INSTAGRAM_PAGE_IDS_ELDERS: ${{ secrets.FACEBOOK_INSTAGRAM_PAGE_IDS_ELDERS }}
          FB_ID_ELDERS: ${{ vars.FB_ID_ELDERS || secrets.FB_ID_ELDERS }}
          IG_ID_ELDERS: ${{ vars.IG_ID_ELDERS || secrets.IG_ID_ELDERS }}
          ELDERS_FB_ID: ${{ vars.ELDERS_FB_ID || secrets.ELDERS_FB_ID }}
          ELDERS_IG_ID: ${{ vars.ELDERS_IG_ID || secrets.ELDERS_IG_ID }}
          CRIBCOMMITTEE_FB_ID: ${{ vars.CRIBCOMMITTEE_FB_ID || secrets.CRIBCOMMITTEE_FB_ID }}
          CRIBCOMMITTEE_IG_ID: ${{ vars.CRIBCOMMITTEE_IG_ID || secrets.CRIBCOMMITTEE_IG_ID }}
          YT_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload || '1' }}
          EXTRAS_ANY_TIME: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: python -m pipeline.run extras ${{ inputs.jobs }}
      - name: Save progress
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.upload == '1')
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/extras.json 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "extras: $(date -u +%F)"; git pull --rebase; git push; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extras-${{ github.run_id }}
          path: output/extras/**/final.mp4
          retention-days: 7
          if-no-files-found: ignore
